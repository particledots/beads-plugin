name: Build plugin (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

jobs:
  build-macos:
    runs-on: macos-14     # Apple silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build engine test, then run it
        run: |
          # Failures are also written as annotations (shown on the run page and readable through the API).
          cmake --build build --target engine_test -j4 > build_log.txt 2>&1 || {
            grep -E "error|Error" build_log.txt | head -8 | while IFS= read -r line; do echo "::error::BUILD: $line"; done
            tail -5 build_log.txt; exit 1; }
          ./build/engine_test > test_log.txt 2>&1; code=$?
          cat test_log.txt
          grep -E "FAIL" test_log.txt | head -8 | while IFS= read -r line; do echo "::error::TEST: $line"; done
          exit $code

      - name: Build AU + VST3
        run: cmake --build build --target Beads_AU Beads_VST3 -j4

      - name: Ad-hoc sign (lets Apple silicon load an unsigned build)
        run: |
          for b in build/Beads_artefacts/Release/AU/*.component build/Beads_artefacts/Release/VST3/*.vst3; do
            codesign --force --deep -s - "$b"
          done

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/Beads_artefacts/Release/AU/*.component dist/
          cp -R build/Beads_artefacts/Release/VST3/*.vst3 dist/
          cp THIRD-PARTY-LICENSES.txt dist/
          lipo -archs dist/*.component/Contents/MacOS/*
          # Show the minimum macOS version baked into each slice (should say 11.0):
          for a in arm64 x86_64; do echo "== $a"; lipo -thin $a dist/*.component/Contents/MacOS/* -output /tmp/slice_$a; otool -l /tmp/slice_$a | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | grep -E "minos|version"; done
          cat > dist/INSTALL.txt <<'TXT'
          1. Unzip.
          2. Open Terminal and run:   xattr -dr com.apple.quarantine ~/Downloads/Beads-macOS/*
             (adjust the path if you unzipped elsewhere; this clears the "downloaded from internet" block)
          3. Copy "Unofficial Beads.component" to  ~/Library/Audio/Plug-Ins/Components/
             Copy "Unofficial Beads.vst3"       to  ~/Library/Audio/Plug-Ins/VST3/
          4. In Logic: Settings > Plug-in Manager > rescan. Look for "particledots: Unofficial Beads"
             (use a MIDI-controlled effect slot if you want the MIDI gate).
          TXT
          ditto -c -k --keepParent dist Beads-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Beads-macOS
          path: Beads-macOS.zip
